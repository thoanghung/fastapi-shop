services:
  db:
    image: pgvector/pgvector:pg18
    container_name: fastapi-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p@ssword
      POSTGRES_DB: fastapi-shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: